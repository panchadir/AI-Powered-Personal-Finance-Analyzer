<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01.5 Dashboard — AI Financial Copilot</title>
  <link rel="stylesheet" href="shared/styles.css">
  <script>
  (function () {
    function ok() { try { var s = JSON.parse(sessionStorage.getItem('afc_session') || 'null'); return !!(s && s.email && (!s.exp || Date.now() < s.exp)); } catch (e) { return false; } }
    if (!ok()) location.replace('01.2-login.html');
    window.addEventListener('pageshow', function () { if (!ok()) location.replace('01.2-login.html'); });
  })();
  </script>
</head>
<body>
  <!-- Section: Left Side Navigation -->
  <nav class="side-nav" id="side-nav-slot" aria-label="Primary"></nav>

  <main class="dash dash--sidenav">

    <!-- Section: Top Nav Bar -->
    <div id="dashboard-topnav" class="dash-topnav">
      <span id="dashboard-topnav-greeting" class="dash-greeting">Good evening, Priya</span>
      <button id="dashboard-topnav-avatar" class="dash-avatar" aria-label="Profile and settings">PS</button>
    </div>

    <!-- Section: Safe-to-Spend Hero Card — full-width, two-column balanced layout -->
    <section id="dashboard-hero" class="hero-card">
      <div class="hero-primary">
        <p id="dashboard-hero-label" class="hero-label">Safe to spend today</p>
        <p id="dashboard-hero-today-amount" class="hero-amount" aria-label="Safe to spend today">₹0</p>
        <p id="dashboard-hero-freshness" class="hero-freshness">Based on your statement from —</p>
      </div>

      <hr class="hero-sep">

      <div class="hero-secondary">
        <div id="dashboard-hero-after-salary" class="hero-after">
          <span id="dashboard-hero-after-salary-label" class="hero-after-label">After your salary lands</span>
          <span id="dashboard-hero-after-salary-amount" class="hero-after-amount">₹0</span>
        </div>

        <div id="dashboard-hero-confidence" class="hero-conf">
          <span id="dashboard-hero-confidence-label" class="hero-conf-label">Confidence</span>
          <button id="dashboard-hero-confidence-chip" class="conf-chip conf-chip--amber"
                  aria-label="Confidence: On track — tap to see what changed it">On track</button>
          <div id="dashboard-hero-confidence-drillin" class="conf-drillin hidden" role="dialog" aria-label="Confidence Score history">
            <p id="conf-drillin-summary" class="conf-drillin-summary"></p>
            <ul id="conf-drillin-events" class="conf-drillin-events"></ul>
          </div>
        </div>

        <div class="hero-why">
          <button id="dashboard-hero-why" class="hero-why-trigger" aria-expanded="false" aria-controls="dashboard-hero-why-content">Why ₹0?</button>
          <p id="dashboard-hero-why-content" class="hero-why-content hidden"></p>
        </div>
      </div>
    </section>

    <!-- Below-the-fold content: responsive card grid, fills available desktop width -->
    <div class="dash-grid">

      <!-- Section: Morning Briefing -->
      <section id="dashboard-briefing" class="briefing-card dash-card">
        <p id="dashboard-briefing-text" class="briefing-text"></p>
        <button id="dashboard-briefing-insights-cta" class="btn btn--primary" onclick="goTo('01.6-ai-insights-recommendations.html')">See my insights →</button>
      </section>

      <!-- Section: View All Transactions CTA -->
      <section id="dashboard-transactions-cta" class="dash-card txn-cta-card">
        <h2 id="dashboard-transactions-cta-headline">Review your transactions</h2>
        <p id="dashboard-transactions-cta-text" class="txn-cta-text"></p>
        <button id="dashboard-transactions-cta-btn" class="btn btn--primary" onclick="goTo('01.4-transactions-table.html')">View All Transactions →</button>
      </section>

      <!-- Section: Spending Breakdown -->
      <section id="dashboard-spending-chart" class="dash-section dash-card">
        <h2 id="dashboard-spending-chart-headline">Where your money went</h2>
        <div class="donut-wrap">
          <div id="dashboard-spending-chart-donut" class="donut" role="img" aria-label="Spending by category"></div>
          <ul id="donut-legend" class="donut-legend"></ul>
        </div>
      </section>

      <!-- Section: Commitments Timeline -->
      <section id="dashboard-commitments" class="dash-section dash-card">
        <h2 id="dashboard-commitments-headline">Upcoming commitments</h2>
        <ul id="dashboard-commitments-list" class="timeline"></ul>
        <button type="button" id="dashboard-commitments-add" class="btn btn--primary add-commitment" onclick="goTo('02.1-commitments-management.html')">+ Add a commitment</button>
      </section>

    </div>

  </main>

  <script src="shared/format.js"></script>
  <script src="shared/data.js"></script>
  <script src="shared/auth.js"></script>
  <script src="shared/commitments.js"></script>
  <script src="shared/nav.js"></script>
  <script>
  (function () {
    'use strict';
    console.log('📄 01.5 Dashboard loaded');

    // ---- shared state ----
    var commits = [];        // current commitments (base + user-added, from the shared Commitments store)
    var baseToday = 0;       // Safe-to-Spend today from the statement (already nets out the base/seeded commitments)
    var baseWhy = '';        // original "why" reasoning

    function greeting() {
      var h = new Date().getHours();
      if (h < 12) return 'Good morning, Priya';
      if (h < 17) return 'Good afternoon, Priya';
      return 'Good evening, Priya';
    }
    document.getElementById('dashboard-topnav-greeting').textContent = greeting();

    // addedTotal = commitments added beyond the base/seeded set (those are already netted into baseToday)
    function addedTotal() {
      return commits.filter(function (c) { return c.userAdded; })
        .reduce(function (a, c) { return a + c.amount; }, 0);
    }
    function currentToday() { return Math.max(0, baseToday - addedTotal()); }

    function renderCommitments() {
      var sorted = commits.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      document.getElementById('dashboard-commitments-list').innerHTML = sorted.map(function (c) {
        var added = c.userAdded ? ' <span class="tl-tag">new</span>' : '';
        return '<li><span class="tl-date">' + c.date_label + '</span>' +
               '<span class="tl-name">' + c.name + added + '</span>' +
               '<span class="tl-amt">' + formatINR(c.amount) + '</span></li>';
      }).join('');
    }

    loadDemoData().then(function (demo) {
      var sts = demo.safe_to_spend, conf = demo.confidence, s = demo.statement;
      baseToday = sts.today;
      baseWhy = sts.why_today;

      var todayEl = document.getElementById('dashboard-hero-today-amount');
      var whyBtn = document.getElementById('dashboard-hero-why');
      var whyContent = document.getElementById('dashboard-hero-why-content');

      // Commitments (shared, persisted store — reflects anything added/edited on the Commitments page)
      commits = Commitments.load(demo.commitments);
      renderCommitments();

      // Hero — reflects any commitments added since the statement was parsed
      var today = currentToday();
      todayEl.textContent = formatINR(today);
      todayEl.setAttribute('aria-label', 'Safe to spend today: ' + formatINR(today));
      document.getElementById('dashboard-hero-freshness').textContent = 'Based on your statement from ' + formatDate(s.statement_date);
      document.getElementById('dashboard-hero-after-salary-amount').textContent = formatINR(sts.after_salary);

      // Confidence chip + Confidence Score Drill-In Panel (epics.md Story 5.2 — committed scope)
      var chip = document.getElementById('dashboard-hero-confidence-chip');
      chip.textContent = conf.level;
      chip.className = 'conf-chip conf-chip--' + conf.variant;
      chip.setAttribute('aria-label', 'Confidence: ' + conf.level + ' — tap to see what changed it');
      var panel = document.getElementById('dashboard-hero-confidence-drillin');
      document.getElementById('conf-drillin-summary').textContent = conf.level + ' — ' + conf.tooltip.replace(/^[^:]+:\s*/, '');
      document.getElementById('conf-drillin-events').innerHTML = (demo.score_events || []).map(function (e) {
        return '<li class="conf-drillin-event">' +
          '<span class="conf-drillin-delta">' + e.delta + '</span>' +
          '<span class="conf-drillin-body">' +
            '<span class="conf-drillin-explanation">' + e.explanation + '</span>' +
            '<span class="conf-drillin-when">' + e.when + '</span>' +
          '</span></li>';
      }).join('');
      chip.addEventListener('click', function () { panel.classList.toggle('hidden'); });

      // Why expander
      whyBtn.textContent = 'Why ' + formatINR(today) + '?';
      whyContent.textContent = addedTotal() > 0
        ? baseWhy + ' You then protected ' + formatINR(addedTotal()) + ' more for commitments you added, leaving ' + formatINR(today) + '.'
        : baseWhy;
      whyBtn.addEventListener('click', function () {
        var open = whyContent.classList.toggle('hidden') === false;
        whyBtn.setAttribute('aria-expanded', String(open));
      });

      // Briefing
      document.getElementById('dashboard-briefing-text').textContent = demo.briefing.text;

      // Transactions CTA
      document.getElementById('dashboard-transactions-cta-text').textContent =
        'See all ' + s.transactions_total + ' categorised transactions from your ' + s.statement_label + ' statement' +
        (s.transactions_need_review ? ' — ' + s.transactions_need_review + ' still need your review.' : '.');

      // Donut chart
      var cats = demo.spending_by_category;
      var total = cats.reduce(function (a, c) { return a + c.amount; }, 0);
      var acc = 0; var stops = [];
      cats.forEach(function (c) {
        var start = (acc / total) * 360;
        acc += c.amount;
        var end = (acc / total) * 360;
        stops.push(c.color + ' ' + start.toFixed(1) + 'deg ' + end.toFixed(1) + 'deg');
      });
      document.getElementById('dashboard-spending-chart-donut').style.background = 'conic-gradient(' + stops.join(', ') + ')';
      document.getElementById('donut-legend').innerHTML = cats.map(function (c) {
        var pct = Math.round((c.amount / total) * 100);
        return '<li><span class="legend-swatch" style="background:' + c.color + '"></span>' +
               '<span>' + c.category + '</span><span class="legend-amt">' + formatINR(c.amount) + ' · ' + pct + '%</span></li>';
      }).join('');

      window.__dashLoaded = true;
    }).catch(function (e) { console.error('dashboard load failed', e); });

    // Left side nav
    renderSideNav('dashboard');

    // expose for verification
    window.__dashState = function () { return { commits: commits.length, addedTotal: addedTotal(), today: currentToday() }; };
  })();
  </script>
</body>
</html>
