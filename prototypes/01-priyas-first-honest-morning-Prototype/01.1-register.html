<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01.1 Register — AI Financial Copilot</title>
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
  <!-- =====================================================================
       01.1 REGISTER  (Sections 1-6 built)
       ===================================================================== -->
  <main class="page page--auth">
    <div class="auth-card">

      <!-- Section 1: App Header -->
      <header id="register-header" class="register-header">
        <div id="register-header-logo" class="logo-mark" aria-hidden="true">₹</div>
        <h1 id="register-header-app-name" class="app-name">AI Financial Copilot</h1>
      </header>

      <!-- Section 2: Trust Signal -->
      <section id="register-trust" class="register-trust">
        <h2 id="register-trust-headline" class="trust-headline">Your honest financial picture. No guessing. No shame.</h2>
        <p id="register-trust-subline" class="trust-subline">We only tell you what we actually know. When we're uncertain, we say so.</p>
      </section>

      <!-- Section 3: Registration Form  +  Section 4 error slots -->
      <form id="register-form" class="register-form" novalidate>
        <div class="field">
          <label for="register-form-email">Email address</label>
          <div class="input-wrap">
            <input id="register-form-email" name="email" type="email" inputmode="email"
                   autocomplete="email" placeholder="you@example.com"
                   aria-describedby="register-form-email-error">
          </div>
          <span class="error" id="register-form-email-error" role="alert"></span>
        </div>

        <div class="field">
          <label for="register-form-password">Password</label>
          <div class="input-wrap">
            <input id="register-form-password" name="password" type="password"
                   autocomplete="new-password" placeholder="8+ characters"
                   aria-describedby="register-form-password-error">
            <button type="button" class="pw-toggle" data-target="register-form-password"
                    aria-label="Show password">Show</button>
          </div>
          <span class="error" id="register-form-password-error" role="alert"></span>
        </div>

        <div class="field">
          <label for="register-form-confirm-password">Confirm password</label>
          <div class="input-wrap">
            <input id="register-form-confirm-password" name="confirmPassword" type="password"
                   autocomplete="new-password" placeholder="Repeat your password"
                   aria-describedby="register-form-confirm-password-error">
            <button type="button" class="pw-toggle" data-target="register-form-confirm-password"
                    aria-label="Show password">Show</button>
          </div>
          <span class="error" id="register-form-confirm-password-error" role="alert"></span>
        </div>

        <button type="submit" id="register-form-cta" class="btn btn--primary">
          <span class="btn-label">Create my account</span>
          <span class="spinner hidden" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Section 5: Existing-user link -->
      <div id="register-existing-user" class="register-existing-user">
        <span class="text-muted">Already have an account? </span>
        <a href="#" id="register-existing-user-link" class="link">Log in</a>
      </div>

      <!-- Section 5: Legal footnote -->
      <p id="register-legal" class="register-legal">
        <span id="register-legal-text" class="text-muted">
          By creating an account you agree to our
          <a href="#" class="link" data-legal="terms">Terms of Service</a> and
          <a href="#" class="link" data-legal="privacy">Privacy Policy</a>.
          We never sell your data.
        </span>
      </p>

    </div>
  </main>

  <!-- Legal modal (Section 5) -->
  <div id="legal-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="legal-modal-title">
    <div class="modal">
      <h3 id="legal-modal-title" style="margin-top:0;">Terms</h3>
      <p id="legal-modal-body" class="text-muted" style="font-size:var(--text-sm);"></p>
      <button type="button" class="btn btn--primary" id="legal-modal-close" style="margin-top:var(--space-md);">Got it</button>
    </div>
  </div>

  <!-- Toast (Section 4 network error) -->
  <div id="register-toast" class="toast hidden" role="status"></div>

  <!-- Shared scripts -->
  <script src="shared/format.js"></script>
  <script src="shared/data.js"></script>
  <script src="shared/nav.js"></script>
  <script>
  /* Page: 01.1 Register — Sections 2-6 logic */
  (function () {
    'use strict';
    console.log('📄 01.1 Register loaded');

    var form = document.getElementById('register-form');
    var cta = document.getElementById('register-form-cta');
    var fields = {
      email: document.getElementById('register-form-email'),
      password: document.getElementById('register-form-password'),
      confirmPassword: document.getElementById('register-form-confirm-password')
    };

    // ---- Validation ----
    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function setError(name, msg) {
      var input = fields[name];
      var err = document.getElementById(input.id + '-error');
      err.textContent = msg || '';
      input.classList.toggle('has-error', !!msg);
    }
    function clearError(name) { setError(name, ''); }

    function validateField(name) {
      var v = fields[name].value.trim();
      if (name === 'email') {
        if (!v) return setError('email', 'Please enter your email address'), false;
        if (!EMAIL_RE.test(v)) return setError('email', "That doesn't look like a valid email"), false;
      }
      if (name === 'password') {
        if (!v) return setError('password', 'Please create a password'), false;
        if (v.length < 8) return setError('password', 'Password must be at least 8 characters'), false;
      }
      if (name === 'confirmPassword') {
        if (!v) return setError('confirmPassword', 'Please confirm your password'), false;
        if (v !== fields.password.value) return setError('confirmPassword', "Passwords don't match"), false;
      }
      clearError(name);
      return true;
    }

    function validateAll() {
      // validate in order; collect all so every empty field shows its message
      var okE = validateField('email');
      var okP = validateField('password');
      var okC = validateField('confirmPassword');
      return okE && okP && okC;
    }

    // blur validation + clear-on-input
    Object.keys(fields).forEach(function (name) {
      fields[name].addEventListener('blur', function () { validateField(name); });
      fields[name].addEventListener('input', function () { clearError(name); });
    });

    // ---- Password show/hide ----
    Array.prototype.forEach.call(document.querySelectorAll('.pw-toggle'), function (btn) {
      btn.addEventListener('click', function () {
        var input = document.getElementById(btn.getAttribute('data-target'));
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Hide' : 'Show';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    });

    // ---- Loading state ----
    function setLoading(on) {
      cta.disabled = on;
      cta.querySelector('.btn-label').classList.toggle('hidden', on);
      cta.querySelector('.spinner').classList.toggle('hidden', !on);
      Object.keys(fields).forEach(function (n) { fields[n].disabled = on; });
    }

    // ---- Toast ----
    var toast = document.getElementById('register-toast');
    var toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 3500);
    }

    // ---- Mock register (Section 6) ----
    function mockRegister(email) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (email === 'taken@example.com') return reject({ code: 'email-taken' });
          if (email === 'network@example.com') return reject({ code: 'network' });
          resolve({ userId: 'demo-' + Date.now(), token: 'demo-token' });
        }, 700);
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validateAll()) return;
      var email = fields.email.value.trim();
      setLoading(true);
      mockRegister(email).then(function (res) {
        console.log('✅ Registered:', res);
        // Simulate auth (spec: httpOnly cookie; prototype uses sessionStorage demo flag)
        sessionStorage.setItem('demoAuth', JSON.stringify({ email: email, ts: Date.now() }));
        window.location.href = '01.2-login.html';
      }).catch(function (err) {
        setLoading(false);
        if (err.code === 'email-taken') {
          setError('email', 'This email is already registered. Log in instead?');
        } else {
          showToast('Something went wrong. Please try again.');
        }
      });
    });

    // ---- Existing-user link (out of scenario scope) ----
    document.getElementById('register-existing-user-link').addEventListener('click', function (e) {
      e.preventDefault();
      showToast('Returning-user login is a separate page (out of this prototype scenario).');
    });

    // ---- Legal modal (Section 5) ----
    var modal = document.getElementById('legal-modal');
    var modalTitle = document.getElementById('legal-modal-title');
    var modalBody = document.getElementById('legal-modal-body');
    var LEGAL = {
      terms: { title: 'Terms of Service', body: 'Placeholder terms for the prototype. In production this opens the full Terms of Service. We frame everything as information, never financial advice.' },
      privacy: { title: 'Privacy Policy', body: 'Placeholder privacy notice (DPDP-compliant). We collect only what is needed to compute your Safe-to-Spend, we never sell your data, and consent is never pre-ticked.' }
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-legal]'), function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var k = a.getAttribute('data-legal');
        modalTitle.textContent = LEGAL[k].title;
        modalBody.textContent = LEGAL[k].body;
        modal.classList.remove('hidden');
      });
    });
    document.getElementById('legal-modal-close').addEventListener('click', function () { modal.classList.add('hidden'); });
    modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.add('hidden'); });
  })();
  </script>
</body>
</html>
